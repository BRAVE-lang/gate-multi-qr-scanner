<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Base background rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#primaryGrad)" />
  
  <!-- Page shape -->
  <rect x="100" y="80" width="312" height="352" rx="20" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Page header line -->
  <rect x="136" y="112" width="160" height="12" rx="6" fill="#94a3b8" />
  <rect x="136" y="132" width="100" height="8" rx="4" fill="#cbd5e1" />
  
  <!-- Multi-QR matrix representations -->
  <!-- QR 1 Top Left -->
  <g transform="translate(136, 160)">
    <rect width="90" height="90" rx="8" fill="#f1f5f9" />
    <rect x="10" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="58" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="62" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="10" y="52" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="58" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="62" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="52" width="12" height="12" fill="#2563eb" rx="2" />
    <rect x="68" y="68" width="12" height="12" fill="#2563eb" rx="2" />
  </g>
  
  <!-- QR 2 Top Right -->
  <g transform="translate(286, 160)">
    <rect width="90" height="90" rx="8" fill="#f1f5f9" />
    <rect x="10" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="58" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="62" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="10" y="52" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="58" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="62" width="8" height="8" fill="#1e293b" />
    <rect x="68" y="52" width="12" height="12" fill="#2563eb" rx="2" />
    <rect x="52" y="68" width="12" height="12" fill="#2563eb" rx="2" />
  </g>

  <!-- QR 3 Bottom Left -->
  <g transform="translate(136, 280)">
    <rect width="90" height="90" rx="8" fill="#f1f5f9" />
    <rect x="10" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="58" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="62" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="10" y="52" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="58" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="62" width="8" height="8" fill="#1e293b" />
    <rect x="60" y="60" width="16" height="16" fill="#2563eb" rx="2" />
  </g>
  
  <!-- QR 4 Bottom Right -->
  <g transform="translate(286, 280)">
    <rect width="90" height="90" rx="8" fill="#f1f5f9" />
    <rect x="10" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="10" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="58" y="16" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="62" y="20" width="8" height="8" fill="#1e293b" />
    <rect x="10" y="52" width="28" height="28" fill="#1e293b" rx="4" />
    <rect x="16" y="58" width="16" height="16" fill="#ffffff" rx="2" />
    <rect x="20" y="62" width="8" height="8" fill="#1e293b" />
    <rect x="52" y="52" width="24" height="24" fill="#2563eb" rx="2" />
  </g>

  <!-- Scanner Laser Line Across Page -->
  <line x1="80" y1="265" x2="432" y2="265" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="80" y1="265" x2="432" y2="265" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
</svg>
